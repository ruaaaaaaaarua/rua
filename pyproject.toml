[tool.ruff]
target-version = "py39"
include = ["app/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
# Correctness first; do not reformat the existing compact Python style.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.9"
files = ["app/models.py", "app/knowledge.py", "app/images.py", "app/prompts.py"]
check_untyped_defs = true
follow_imports = "silent"
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
